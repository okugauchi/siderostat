name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rewrite/mode-aware
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo test --all-targets --all-features
      # V02: workspace all-features gate（root だけでなく monitor/xtask も）。
      - run: cargo test --workspace --all-targets --all-features
      # V02: workspace gate + 実 test 数 > 0 を保証する受入 suite。
      - run: cargo test --test v040_acceptance --features test-support

  macos-dev-artifacts:
    name: macOS dev artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      - run: bash scripts/verify-macos-dev-artifacts.sh
