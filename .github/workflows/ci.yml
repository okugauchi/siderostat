name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rewrite/mode-aware
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: macos-15
    env:
      CODEX_REPLAY_BIN: ${{ runner.temp }}/codex-replay/target/debug/codex-replay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out the accepted Codex parser source
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: 3d2ee51ca2d5db578f328aa75e20aa22c0197c9a
          path: build/codex-parser-source
          persist-credentials: false
      - name: Build the real Codex parser replay harness
        run: python3 scripts/codex-replay/rebuild.py build/codex-parser-source "$RUNNER_TEMP/codex-replay" 3d2ee51ca2d5db578f328aa75e20aa22c0197c9a
      - run: cargo test --all-targets
      - run: cargo test --all-targets --all-features
      # V02: workspace all-features gate（root だけでなく monitor/xtask も）。
      - run: cargo test --workspace --all-targets --all-features
      # V02: workspace gate + 実 test 数 > 0 を保証する受入 suite。
      - run: cargo test --test v040_acceptance --features test-support

  macos-dev-artifacts:
    name: macOS dev artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      - run: bash scripts/verify-macos-dev-artifacts.sh
