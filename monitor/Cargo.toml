[package]
name = "siderostat-monitor"
version = "0.1.0"
edition = "2024"
description = "macOS menu bar monitor for siderostat"

[dependencies]
anyhow = "1.0.103"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tray-icon = "0.19"

[dev-dependencies]
