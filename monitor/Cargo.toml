[package]
name = "siderostat-monitor"
version = "0.3.0"
edition = "2024"
description = "macOS menu bar monitor for siderostat"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.4"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.24.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSString", "NSUserDefaults"] }
objc2-service-management = "0.3.2"
siderostat-core = { package = "siderostat", path = ".." }


[dev-dependencies]
tempfile = "3.10"
