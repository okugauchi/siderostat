# Distribution example for the mode-aware reverse proxy.
# The TOML parser accepts these placeholder values, but validation requires real files:
# - ds4.binary, ds4.dspark.support_model, and both model_manifest files must be regular,
#   canonical, non-symlink files.
# - Every secret/token file must contain 32+ bytes with mode 0600; the three files and values differ.
# - The control secret and peer proxy token values are each shared between the two nodes. The admin
#   token is node-local.
# Replace every placeholder and fill the secret files before running `siderostat serve --config ...`.
# On a worker node, change only cluster.node_id and the node-specific paths; role is derived from the
# interface address, never set directly.
schema_version = 2

[proxy]
public_listen = "127.0.0.1:18080"
admin_listen = "127.0.0.1:18081"
request_body_limit_bytes = 33554432
max_in_flight = 2

[proxy.timeouts]
connect = "5s"
response_headers = "3600s"
first_body_byte = "2400s"
stream_idle = "2400s"

[cluster]
enabled = true
node_id = "macstudio-coordinator"
interface = "bridge0"
coordinator_address = "10.99.0.1"
worker_address = "10.99.0.2"
control_port = 9920
ds4_distributed_port = 9911
peer_ingress_port = 18082
state_path = "$HOME/Library/Application Support/siderostat/cluster-state.json"
manifest_cache_dir = "$HOME/Library/Application Support/siderostat/manifests"

[cluster.discovery]
mode = "bonjour-with-static-fallback"
bonjour_service_type = "_ds4cluster._tcp"
bonjour_domain = "local."
event_debounce = "500ms"
reconcile_interval = "30s"

[cluster.security]
control_secret_file = "$HOME/Library/Application Support/siderostat/secrets/PLACEHOLDER-cluster-control"
peer_proxy_token_file = "$HOME/Library/Application Support/siderostat/secrets/PLACEHOLDER-peer-proxy"
admin_token_file = "$HOME/Library/Application Support/siderostat/secrets/PLACEHOLDER-admin"
max_clock_skew = "30s"
nonce_ttl = "5m"

[cluster.policy]
auto_pair = true
auto_promote = true
auto_demote = true
required_peer_stability = "5s"
route_loss_grace = "15s"
promotion_backoff = "300s"
max_consecutive_promotion_failures = 3

[cluster.timeouts]
peer_connect = "1s"
peer_request = "3s"
control_lease = "15s"
drain = "180s"
stop = "180s"
rendezvous_hello = "900s"
worker_startup = "600s"
coordinator_startup = "600s"
complete_route = "180s"
standalone_startup = "900s"

# Automatic throughput recovery is opt-in. Keep this disabled until the H-10
# two-node change window and evidence review.
[recovery]
enabled = false
admission_drain_timeout = "60s"
cooldown = "3600s"
max_attempts_12h = 2
low_decode_tps = 5.0
low_decode_duration = "30s"
progress_stall = "60s"
canary_deadline = "30s"

[ds4]
binary = "$HOME/LLM/ds4/PLACEHOLDER-ds4-server"
working_directory = "$HOME/LLM/ds4"
http_host = "127.0.0.1"
http_port = 8000
allow_sigkill = true

# DSpark is supported for resident Standalone only with the current DS4 baseline. It is not added
# to Distributed coordinator/worker argv after promotion.
[ds4.dspark]
enabled = true
support_model = "$HOME/Library/Application Support/siderostat/models/PLACEHOLDER-dspark-support-0731.gguf"
confidence = 0.7
strict = false

[ds4.standalone]
profile_id = "flash-0731-q2-q4-resident-dspark"
model = "$HOME/Library/Application Support/siderostat/models/PLACEHOLDER-standalone.gguf"
model_manifest = "$HOME/Library/Application Support/siderostat/manifests/standalone-flash-0731-q2-q4-resident-dspark.json"
checkpoint = "flash-0731"
quantization = "q2-q4"
residency = "resident"
context_size = 384000
kv_disk_dir = "$HOME/Library/Caches/ds4-kv/standalone/flash-0731-q2-q4-resident-dspark"
kv_disk_space_mb = 131072
extra_args = []

[ds4.distributed]
topology = "layer-parallel"
quantization = "mxfp4"
model = "$HOME/Library/Application Support/siderostat/models/PLACEHOLDER-mxfp4.gguf"
model_manifest = "$HOME/Library/Application Support/siderostat/manifests/mxfp4-0731.json"
checkpoint = "flash-0731"
context_size = 384000
coordinator_layers = "0:19"
worker_layers = "20:output"
kv_disk_dir = "$HOME/Library/Caches/ds4-kv/distributed/mxfp4-0731"
kv_disk_space_mb = 131072
extra_args = ["--debug"]

[logging]
format = "json"
level = "info"

[notifications]
enabled = true
sound = true

[startup_cleanup]
# When stale siderostat/ds4-server processes are found, notify and restart after 5 seconds.
# Set false to decline cleanup by default.
auto_restart = true
