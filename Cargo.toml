[package]
name = "siderostat"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["monitor"]

[features]
default = []
test-support = []

[[bin]]
name = "fake-ds4"
path = "src/bin/fake-ds4.rs"
required-features = ["test-support"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tower = "0.5.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
system-configuration = "0.8.0"
