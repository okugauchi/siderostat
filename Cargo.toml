[package]
name = "siderostat"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["monitor"]

[features]
default = []
test-support = []

[[bin]]
name = "fake-ds4"
path = "src/bin/fake-ds4.rs"
required-features = ["test-support"]

[dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
bytes = "1.10"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.31"
hmac = "0.12"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.7"
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
tower = "0.5.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
system-configuration = "0.7"
