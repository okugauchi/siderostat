[package]
name = "siderostat"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"

[workspace]
members = ["monitor", "xtask"]

[features]
default = []
test-support = ["dep:tower"]

[[bin]]
name = "fake-ds4"
path = "src/bin/fake-ds4.rs"
required-features = ["test-support"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", optional = true }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tower = "0.5.3"
tracing-test = "0.2.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSString", "NSUserDefaults"] }
objc2-user-notifications = {
    version = "0.3.2",
    default-features = false,
    features = [
        "UNNotificationContent",
        "UNNotificationRequest",
        "UNNotificationSound",
        "UNNotificationTrigger",
        "UNUserNotificationCenter",
        "block2",
    ],
}
system-configuration = "0.8.0"
